name: Nightly Scrapes

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-scrapes
  cancel-in-progress: false

jobs:
  refresh-scraped-perfumes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Start local scrape API
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      - name: Refresh scraped perfume snapshot
        run: node backend/scripts_generate_scraped_snapshot.mjs

      - name: Commit snapshot changes
        run: |
          if git diff --quiet -- src/data/scraped-perfumes.json; then
            echo "No scraped perfume changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scraped-perfumes.json
          git commit -m "Update scraped perfume snapshot"
          git push
